# Docker Compose configuration for Federated Learning
version: '3.8'

services:
  # Federated Learning Training Service
  fl-training:
    build: .
    image: federated-learning:latest
    container_name: fl-training
    volumes:
      # Mount data and results for persistence
      - ./data:/app/data
      - ./checkpoints:/app/checkpoints
      - ./logs:/app/logs
      - ./results:/app/results
      - ./plots:/app/plots
    environment:
      - PYTHONUNBUFFERED=1
    command: >
      python train_federated.py
      --dataset mnist
      --num_clients 10
      --num_rounds 50
      --local_epochs 5
    networks:
      - fl-network

  # TensorBoard Service
  tensorboard:
    build: .
    image: federated-learning:latest
    container_name: fl-tensorboard
    ports:
      - "6006:6006"
    volumes:
      - ./logs:/app/logs
    command: tensorboard --logdir=/app/logs --host=0.0.0.0
    networks:
      - fl-network

  # Jupyter Notebook Service (for interactive experiments)
  jupyter:
    build: .
    image: federated-learning:latest
    container_name: fl-jupyter
    ports:
      - "8888:8888"
    volumes:
      - .:/app
    environment:
      - JUPYTER_ENABLE_LAB=yes
    command: >
      jupyter lab
      --ip=0.0.0.0
      --port=8888
      --no-browser
      --allow-root
      --NotebookApp.token=''
      --NotebookApp.password=''
    networks:
      - fl-network

networks:
  fl-network:
    driver: bridge

volumes:
  fl-data:
  fl-checkpoints:
  fl-logs:
