# DCGAN Configuration for CIFAR-10

# Model
model: dcgan
latent_dim: 100
image_size: 64
base_channels: 64

# Dataset
dataset: cifar10
data_path: ./data
batch_size: 64
num_workers: 4

# Training
epochs: 100
g_lr: 0.0002
d_lr: 0.0002
beta1: 0.5
beta2: 0.999

# Device
device: cuda

# Checkpointing
save_dir: checkpoints/dcgan_cifar10
save_interval: 10
sample_interval: 5
