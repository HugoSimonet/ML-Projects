# Wasserstein GAN Configuration for CelebA

# Model
model: wgan
latent_dim: 128
image_size: 128
base_channels: 64

# Dataset
dataset: celeba
data_path: ./data
batch_size: 32
num_workers: 4

# Training
epochs: 200
g_lr: 0.0001
d_lr: 0.0001
beta1: 0.0
beta2: 0.9

# WGAN-specific
n_critic: 5
lambda_gp: 10.0

# Device
device: cuda

# Checkpointing
save_dir: checkpoints/wgan_celeba
save_interval: 10
sample_interval: 5
