apiVersion: apps/v1
kind: Deployment
metadata:
  labels:
    app: random_forest_classifier
    component: model-server
    version: v1
  name: random-forest-classifier-v1
  namespace: mlops
spec:
  replicas: 3
  selector:
    matchLabels:
      app: random_forest_classifier
      version: v1
  template:
    metadata:
      labels:
        app: random_forest_classifier
        component: model-server
        version: v1
    spec:
      containers:
      - env:
        - name: MODEL_NAME
          value: random_forest_classifier
        - name: MODEL_VERSION
          value: v1
        image: docker.io/myorg/random_forest_classifier:v1
        livenessProbe:
          httpGet:
            path: /health
            port: 8000
          initialDelaySeconds: 30
          periodSeconds: 10
        name: model-server
        ports:
        - containerPort: 8000
          name: http
          protocol: TCP
        readinessProbe:
          httpGet:
            path: /health
            port: 8000
          initialDelaySeconds: 10
          periodSeconds: 5
        resources:
          limits:
            cpu: 2000m
            memory: 2Gi
          requests:
            cpu: 500m
            memory: 512Mi
      serviceAccountName: mlops-sa
