apiVersion: v1
kind: ConfigMap
metadata:
  name: mlops-config
  namespace: mlops
data:
  pipeline_config.yaml: |
    data:
      ingestion:
        source_type: local
        source_path: ./data
        file_format: csv
      validation:
        thresholds:
          max_missing_pct: 0.1
      features:
        scaling_method: standard
    monitoring:
      window_size: 1000
      alert_thresholds:
        error_rate: 0.1
        latency_ms: 1000
    security:
      enable_rbac: true
      enable_audit: true
---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: model-storage-pvc
  namespace: mlops
spec:
  accessModes:
  - ReadWriteMany
  resources:
    requests:
      storage: 10Gi
  storageClassName: standard
---
apiVersion: monitoring.coreos.com/v1
kind: ServiceMonitor
metadata:
  name: ml-model-monitor
  namespace: mlops
  labels:
    app: ml-model
spec:
  selector:
    matchLabels:
      app: ml-model
  endpoints:
  - port: http
    path: /metrics
    interval: 30s
    scrapeTimeout: 10s
---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: mlops-sa
  namespace: mlops
---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: mlops-role
  namespace: mlops
rules:
- apiGroups: [""]
  resources: ["pods", "services", "configmaps"]
  verbs: ["get", "list", "watch"]
- apiGroups: ["apps"]
  resources: ["deployments"]
  verbs: ["get", "list", "watch"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: mlops-rolebinding
  namespace: mlops
subjects:
- kind: ServiceAccount
  name: mlops-sa
  namespace: mlops
roleRef:
  kind: Role
  name: mlops-role
  apiGroup: rbac.authorization.k8s.io
