apiVersion: apps/v1
kind: Deployment
metadata:
  labels:
    app: custom_logistic_regression
    component: model-server
    version: v1
  name: custom-logistic-regression-v1
  namespace: mlops
spec:
  replicas: 3
  selector:
    matchLabels:
      app: custom_logistic_regression
      version: v1
  template:
    metadata:
      labels:
        app: custom_logistic_regression
        component: model-server
        version: v1
    spec:
      containers:
      - env:
        - name: MODEL_NAME
          value: custom_logistic_regression
        - name: MODEL_VERSION
          value: v1
        image: docker.io/myorg/custom_logistic_regression:v1
        livenessProbe:
          httpGet:
            path: /health
            port: 8000
          initialDelaySeconds: 30
          periodSeconds: 10
        name: model-server
        ports:
        - containerPort: 8000
          name: http
          protocol: TCP
        readinessProbe:
          httpGet:
            path: /health
            port: 8000
          initialDelaySeconds: 10
          periodSeconds: 5
        resources:
          limits:
            cpu: 2000m
            memory: 2Gi
          requests:
            cpu: 500m
            memory: 512Mi
      serviceAccountName: mlops-sa
