apiVersion: autoscaling/v2
kind: HorizontalPodAutoscaler
metadata:
  name: simple-model-v1-hpa
  namespace: mlops
spec:
  maxReplicas: 10
  metrics:
  - resource:
      name: cpu
      target:
        averageUtilization: 70
        type: Utilization
    type: Resource
  minReplicas: 2
  scaleTargetRef:
    apiVersion: apps/v1
    kind: Deployment
    name: simple-model-v1
