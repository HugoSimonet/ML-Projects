# Configuration for Chest X-Ray Classification

task: classification
modality: XRAY

data:
  data_dir: ./data/chest_xray
  batch_size: 32
  image_size: [224, 224]
  normalize_method: min_max
  augmentation: true
  balanced_sampling: true

model:
  architecture: densenet121
  num_classes: 2
  in_channels: 1
  pretrained: true
  dropout: 0.5

training:
  num_epochs: 50
  learning_rate: 0.0001
  loss_function: focal
  early_stopping_patience: 10

uncertainty:
  enable: true
  method: mc_dropout
  num_samples: 30

explainability:
  enable: true
  methods:
    - gradcam
    - integrated_gradients

seed: 42
device: cuda
