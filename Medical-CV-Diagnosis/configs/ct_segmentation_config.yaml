# Configuration for CT Scan Segmentation

task: segmentation
modality: CT

data:
  data_dir: ./data/ct_segmentation
  batch_size: 16
  image_size: [256, 256]
  normalize_method: window
  augmentation: true

model:
  architecture: attention_unet
  num_classes: 5  # Background + 4 organs
  in_channels: 1
  pretrained: false

training:
  num_epochs: 100
  learning_rate: 0.0001
  loss_function: dice
  mixed_precision: true
  early_stopping_patience: 20

uncertainty:
  enable: false

explainability:
  enable: false

seed: 42
device: cuda
