model:
  model_type: VanillaTransformer
  enc_in: 7
  dec_in: 7
  c_out: 7
  seq_len: 96
  label_len: 48
  pred_len: 24
  d_model: 512
  n_heads: 8
  e_layers: 2
  d_layers: 1
  d_ff: 2048
  dropout: 0.1
  embed: fixed
  freq: h
  activation: gelu
  factor: 5
  distil: true
  moving_avg: 25

training:
  batch_size: 32
  epochs: 100
  learning_rate: 0.0001
  weight_decay: 0.0001
  optimizer: adam
  criterion: mse
  scheduler: cosine
  early_stopping_patience: 10
  gradient_clip: 1.0
  use_amp: false
  num_workers: 4
  device: cuda
  gpu_id: 0

data:
  dataset: synthetic
  root_path: ./data/
  data_path: ETTh1.csv
  features: M
  target: OT
  freq: h
  train_ratio: 0.7
  val_ratio: 0.1
  scale: true
  timeenc: 0

experiment:
  exp_name: vanilla_transformer_exp1
  seed: 42
  save_dir: ./checkpoints/
  log_dir: ./logs/
  result_dir: ./results/
  save_best: true
  save_last: true
  log_interval: 1
  eval_interval: 1
